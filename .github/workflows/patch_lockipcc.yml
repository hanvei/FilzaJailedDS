name: LockIPCC Auto-Patcher

on:
  push:
    paths:
      - 'LockIPCC.ipa'
  workflow_dispatch:

jobs:
  patch:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@main

      - name: Install tools
        run: |
          brew install ldid 2>&1 | tail -3 || true
          which ldid || echo "ldid not available - will skip signing"

      - name: Get IPA
        run: |
          echo "=== 检查 IPA ==="
          ls -la LockIPCC.ipa || { echo "❌ 找不到 LockIPCC.ipa"; exit 1; }

      - name: Extract IPA
        run: |
          rm -rf Payload *.app
          unzip -o LockIPCC.ipa -d .
          find . -maxdepth 3 -name "*.app" -type d

      - name: Find target Mach-O
        id: findbin
        run: |
          APP_DIR=$(find . -name "*.app" -type d | head -1)
          echo "App: $APP_DIR"
          BIN=$(find "$APP_DIR" -maxdepth 1 -type f -executable | xargs ls -lS | head -1 | awk '{print $NF}')
          echo "Binary: $BIN"
          file "$BIN"
          lipo -info "$BIN"
          echo "BIN=$BIN" >> $GITHUB_OUTPUT

      - name: Patch binary
        run: |
          BIN="${{ steps.findbin.outputs.BIN }}"
          echo "=== Patch $BIN ==="
          cp "$BIN" "${BIN}.orig"
          curl -fsSL https://raw.githubusercontent.com/hanvei/FilzaJailedDS/main/LockIPCC_patched -o LockIPCC_patched
          ls -la LockIPCC_patched
          cp LockIPCC_patched "$BIN"
          chmod +x "$BIN"
          echo ""
          echo "=== 验证 patch ==="
          python3 -c "
with open('$BIN','rb') as f: d=f.read()
checks = [
  (0x9b550, bytes([0x01,0x00,0x00,0x14]), 'branch redirect'),
  (0x9b558, bytes([0x20,0x00,0x80,0xD2]), 'mov x0,#1'),
]
for off, exp, label in checks:
  ok = d[off:off+len(exp)] == exp
  print(f'  0x{off:x} {label}: {\"OK\" if ok else \"FAIL\"}')
"

      - name: Re-sign for jailbreak
        run: |
          BIN="${{ steps.findbin.outputs.BIN }}"
          ldid -S "$BIN" 2>/dev/null && echo "ldid ok" || true
          APP_DIR=$(dirname "$BIN")
          find "$APP_DIR" -type f -executable 2>/dev/null | while read f; do
            ldid -S "$f" 2>/dev/null && echo "Signed: $(basename $f)"
          done

      - name: Repack IPA
        run: |
          rm -f LockIPCC_patched.ipa
          zip -r LockIPCC_patched.ipa Payload/ -x "*.DS_Store"
          ls -la LockIPCC_patched.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LockIPCC_patched_ipa
          path: LockIPCC_patched.ipa
          if-no-files-found: error
          retention-days: 30
