name: LockIPCC Auto-Patcher

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@main

      - name: Install tools
        run: |
          brew install ldid 2>&1 | tail -3 || true
          which ldid || echo "ldid not available - will skip signing"

      - name: Check IPA
        run: |
          echo "=== 检查 IPA ==="
          ls -la LockIPCC.ipa || { echo "ERROR: 找不到 LockIPCC.ipa"; exit 1; }

      - name: Extract IPA
        run: |
          rm -rf Payload *.app
          unzip -o LockIPCC.ipa -d .
          echo "解压完成"
          find . -name "*.app" -type d

      - name: Find Mach-O
        id: findbin
        run: |
          APP_DIR=$(find . -name "*.app" -type d | head -1)
          echo "App bundle: $APP_DIR"
          BIN=$(find "$APP_DIR" -maxdepth 1 -type f -executable | xargs ls -lS | head -1 | awk '{print $NF}')
          echo "Binary: $BIN"
          file "$BIN"
          lipo -info "$BIN"
          echo "BIN=$BIN" >> $GITHUB_OUTPUT

      - name: Apply isActivated patch
        run: |
          BIN="${{ steps.findbin.outputs.BIN }}"
          echo "=== Patch $BIN ==="
          cp "$BIN" "${BIN}.orig"
          curl -fsSL https://raw.githubusercontent.com/hanvei/FilzaJailedDS/main/LockIPCC_patched -o LockIPCC_patched
          ls -la LockIPCC_patched
          cp LockIPCC_patched "$BIN"
          chmod +x "$BIN"
          echo ""
          echo "=== 验证 patch 关键字节 ==="
          python3 -c "
with open('$BIN','rb') as f: d=f.read()
checks = [
  (0x9b550, bytes([0x01,0x00,0x00,0x14]), 'branch redirect to stub'),
  (0x9b558, bytes([0x20,0x00,0x80,0xD2]), 'mov x0,#1 (return YES)'),
]
all_ok=True
for off, exp, label in checks:
  ok = d[off:off+len(exp)] == exp
  if not ok: all_ok=False
  print(f'  0x{off:x} {label}: {\"PASS\" if ok else \"FAIL\"} ({d[off:off+len(exp)].hex()})')
print(f'Patch verification: {\"ALL PASS\" if all_ok else \"FAILED\"}')
if not all_ok: exit(1)
"

      - name: ldid re-sign
        run: |
          BIN="${{ steps.findbin.outputs.BIN }}"
          echo "=== ldid -S $BIN ==="
          ldid -S "$BIN" 2>/dev/null || echo "ldid skipped (ok on macOS runner)"
          APP_DIR=$(dirname "$BIN")
          find "$APP_DIR" -type f -executable 2>/dev/null | while read f; do
            ldid -S "$f" 2>/dev/null && echo "  Signed: $(basename $f)"
          done || true

      - name: Repack IPA
        run: |
          rm -f LockIPCC_patched.ipa
          zip -r LockIPCC_patched.ipa Payload/ -x "*.DS_Store"
          ls -la LockIPCC_patched.ipa
          unzip -l LockIPCC_patched.ipa | tail -3

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LockIPCC_patched_ipa
          path: LockIPCC_patched.ipa
          retention-days: 30
