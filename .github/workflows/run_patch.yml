name: Run LockIPCC Patcher

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@main

      - name: Install ldid
        run: brew install ldid 2>&1 | tail -3 || true

      - name: Extract IPA
        run: |
          ls -la LockIPCC.ipa || { echo "ERROR: LockIPCC.ipa not found"; exit 1; }
          rm -rf Payload *.app
          unzip -o LockIPCC.ipa -d .
          echo "=== 解压结果 ==="
          ls -la Payload/
          find . -maxdepth 3 -name "*.app" -print

      - name: Find + Patch Mach-O
        run: |
          APP_DIR=$(find . -maxdepth 4 -name "*.app" -type d | head -1)
          echo "App bundle: $APP_DIR"
          [ -z "$APP_DIR" ] && { echo "ERROR: 找不到 .app"; exit 1; }
          
          BIN="$APP_DIR/LockIPCC"
          echo "Binary: $BIN"
          ls -la "$BIN"
          
          if [ ! -f "$BIN" ]; then
            echo "ERROR: $BIN not found"
            ls -la "$APP_DIR/"
            exit 1
          fi
          
          file "$BIN"
          lipo -info "$BIN"
          
          # 备份 + patch
          cp "$BIN" "${BIN}.orig"
          curl -fsSL https://raw.githubusercontent.com/hanvei/FilzaJailedDS/main/LockIPCC_patched -o LockIPCC_patched
          cp LockIPCC_patched "$BIN"
          chmod +x "$BIN"
          echo ""
          echo "=== Patch 完成 ==="
          echo "Patched file size: $(ls -l "$BIN" | awk '{print $5}')"

      - name: ldid + codesign
        run: |
          APP_DIR=$(find . -maxdepth 4 -name "*.app" -type d | head -1)
          ldid -S "$APP_DIR/LockIPCC" 2>/dev/null || true
          find "$APP_DIR" -type f -executable 2>/dev/null | while read f; do
            ldid -S "$f" 2>/dev/null && echo "  Signed: $(basename $f)"
          done || true

      - name: Repack + Upload
        run: |
          rm -f LockIPCC_patched.ipa
          zip -r LockIPCC_patched.ipa Payload/ -x "*.DS_Store"
          ls -la LockIPCC_patched.ipa
