name: Run LockIPCC Patcher

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@main

      - name: Install ldid
        run: brew install ldid 2>&1 | tail -3 || true

      - name: Extract IPA
        run: |
          unzip -o LockIPCC.ipa -d .
          ls Payload/LockIPCC.app/LockIPCC

      - name: Apply ALL-patched binary
        run: |
          cp LockIPCC_all_patched Payload/LockIPCC.app/LockIPCC
          chmod +x Payload/LockIPCC.app/LockIPCC
          echo "=== 验证 patch ==="
          python3 -c "
with open('Payload/LockIPCC.app/LockIPCC','rb') as f: d=f.read()
# 检查 isActivated
checks = [0x9b548, 0x9b52c, 0x9c714, 0x9c6fe, 0x9c6f2, 0x9ad14, 0x9ad08]
for off in checks:
    patched = d[off:off+4] == bytes([0x20,0x00,0x80,0xD2]) or d[off+8:off+12] == bytes([0x01,0x00,0x00,0x14])
    print(f'  0x{off:x}: {\"OK\" if patched else \"CHECK\"}')
"

      - name: ldid sign
        run: |
          find Payload/LockIPCC.app -type f -executable | while read f; do
            ldid -S "$f" 2>/dev/null && echo "Signed: $f"
          done || true

      - name: Repack IPA
        run: |
          rm -f LockIPCC_patched.ipa
          zip -r LockIPCC_patched.ipa Payload/ -x "*.DS_Store"
          ls -la LockIPCC_patched.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LockIPCC_patched_ipa
          path: LockIPCC_patched.ipa
          retention-days: 30
