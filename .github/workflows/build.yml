name: Build FilzaApplySandboxExt

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout + submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install osxcross
        shell: bash
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm lld cmake git python3-pip unzip pkg-config nasm
          export OSXCROSS=$HOME/osxcross
          git clone --depth=1 https://github.com/tpoechtrager/osxcross.git "$OSXCROSS"
          cd "$OSXCROSS"
          ls tarballs/ 2>/dev/null || echo "empty tarballs"

      - name: Install iOS SDK headers
        shell: bash
        run: |
          cd $HOME/osxcross
          # Try get_sdk.sh first
          if command -v curl; then
            bash tools/get_sdk.sh macosx 15.5 2>&1 || true
          fi
          # List what we got
          ls -la tarballs/ || echo "no sdk yet"
          # If empty, download from apple opensource directly
          if ! ls tarballs/*.tar.xz 1>/dev/null 2>&1; then
            echo "Manual download..."
            curl -sL https://opensource.apple.com/tarballs/iPhoneOSSDK/iPhoneOSSDK-15.5.tar.gz -o /tmp/sdk.tar.gz || echo "apple 404"
            # Alternative: use iPhoneOS SDK from github mirror
            curl -sL https://github.com/nicovank/ios-sdk-headers/raw/main/iPhoneOS15.5.sdk.tar.xz -o tarballs/iPhoneOS15.5.sdk.tar.xz 2>&1 || true
          fi
          ls -la tarballs/

      - name: Build osxcross + compile
        shell: bash
        run: |
          set -e
          export OSXCROSS=$HOME/osxcross
          cd "$OSXCROSS"
          if ls tarballs/*.tar.xz 1>/dev/null 2>&1; then
            echo "=== Building osxcross ==="
            UNATTENDED=1 ./build.sh 2>&1 | tail -20
            echo "=== Build dylib ==="
            export PATH=$OSXCROSS/target/bin:$PATH
            cd "$GITHUB_WORKSPACE"
            # Use osxcross clang
            x86_64-apple-darwin21-clang --version
            # Compile...
          else
            echo "NO SDK - cannot build"
          fi

      - name: Upload dylib
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FilzaApplySandboxExt.dylib
          path: FilzaApplySandboxExt.dylib