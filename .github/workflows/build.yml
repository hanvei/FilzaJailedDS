name: Build FilzaApplySandboxExt

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-v1

      - name: Install Theos (cached)
        if: steps.cache-theos.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos

      - name: Build dylib
        shell: bash
        env:
          THEOS: ${{ github.workspace }}/theos-bind  # 兼容 Makefile
        run: |
          # 把 ~/theos 做成 ./theos 软链或直接设 THEOS
          export THEOS="$HOME/theos"
          cd "$GITHUB_WORKSPACE"
          make clean || true
          make

      - name: Verify output
        shell: bash
        run: |
          ls -la .theos/obj/FilzaApplySandboxExt.dylib
          file .theos/obj/FilzaApplySandboxExt.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: FilzaApplySandboxExt.dylib
          path: .theos/obj/FilzaApplySandboxExt.dylib

      - name: Upload deb
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FilzaApplySandboxExt.deb
          path: .theos/*.deb