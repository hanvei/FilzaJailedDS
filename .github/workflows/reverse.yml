name: Reverse-Engineer LockIPCC Registration

on:
  workflow_dispatch:

jobs:
  reverse:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Dump Full Disassembly with Xcode llvm-objdump
        shell: bash
        run: |
          xcrun --find llvm-objdump
          xcrun llvm-objdump -d -m --macho lockipcc_arm64e.macho > full_disasm.txt 2>&1
          ls -la full_disasm.txt
          wc -l full_disasm.txt

      - name: Extract key functions
        shell: bash
        run: |
          python3 << 'PYEOF' > key_funcs.txt 2>&1
          import re
          with open('full_disasm.txt') as f:
              data = f.read()
          print(f'Total lines: {len(data.splitlines())}')
          functions = ['calculateCorrectActivateCode', 'getFixedMachineCode',
                      'getCarrierCodeSuffix', 'getCorrectActivateCode',
                      'copyMachineCode', 'isActivated', 'bootstrap_register',
                      'globalLockCarrierTapped', 'keychainGetObjectForKey',
                      'keychainSetObject', 'setActivated']
          for fn in functions:
              pattern = re.compile(rf'^{fn}>$', re.MULTILINE)
              matches = list(pattern.finditer(data))
              if matches:
                  print(f'\n{"="*60}')
                  print(f'=== {fn}: {len(matches)} matches ===')
                  print('='*60)
                  for m in matches:
                      start = m.start()
                      next_fn = re.search(r'\n\n[^ \n]+>:', data[m.end():])
                      end = m.end() + next_fn.start() if next_fn else len(data)
                      block = data[start:end]
                      if len(block) > 3000:
                          block = block[:3000] + '\n...(TRUNCATED)'
                      print(block)
          PYEOF
          ls -la key_funcs.txt

      - uses: actions/upload-artifact@v4
        with:
          name: lockipcc_reverse_v2
          path: |
            full_disasm.txt
            key_funcs.txt
