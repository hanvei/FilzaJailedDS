name: Reverse-Engineer LockIPCC Registration

on:
  workflow_dispatch:

jobs:
  reverse:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM + Dump Full Disassembly
        run: |
          brew install llvm
          llvm-objdump -d -m --macho lockipcc_arm64e.macho > full_disasm.txt 2>&1
          echo "Full disasm size: $(wc -c < full_disasm.txt)"

      - name: Extract key functions
        run: |
          python3 << 'PYEOF' > key_funcs.txt
          import re
          with open('full_disasm.txt') as f:
              data = f.read()
          print(f'Total disasm lines: {len(data.splitlines())}')
          functions = ['calculateCorrectActivateCode', 'getFixedMachineCode',
                      'getCarrierCodeSuffix', 'getCorrectActivateCode',
                      'copyMachineCode', 'isActivated', 'bootstrap_register',
                      'globalLockCarrierTapped', 'keychainGetObjectForKey',
                      'keychainSetObject', 'persist', 'createCarrierDirectories',
                      'setActivated']
          for fn in functions:
              pattern = re.compile(rf'^{fn}>$', re.MULTILINE)
              matches = list(pattern.finditer(data))
              if matches:
                  print(f'\n{"="*60}')
                  print(f'=== {fn}: {len(matches)} matches ===')
                  print('='*60)
                  for m in matches:
                      start = m.start()
                      next_fn = re.search(r'\n\n[^ \n]+>:', data[m.end():])
                      end = m.end() + next_fn.start() if next_fn else len(data)
                      print(data[start:end])
          PYEOF

      - uses: actions/upload-artifact@v4
        with:
          name: lockipcc_reverse_v2
          path: |
            full_disasm.txt
            key_funcs.txt
