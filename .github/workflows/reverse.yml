name: Simple LockIPCC Reversing

on:
  workflow_dispatch:

jobs:
  rev:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: List ObjC methods with selectors
        shell: bash
        run: |
          # arm64 slice is at offset 0x4000 in FAT file
          # Use tail + dd to extract, or just use otool directly which handles FAT
          xcrun otool -o lockipcc_arm64e.macho 2>&1 | head -5 || true
          
          # Actually let's try directly on the FAT binary
          # First try otool -V to see version
          xcrun otool -V 2>&1
          
          # Extract arm64 slice
          dd if=lockipcc_arm64e.macho bs=1 skip=0 count=4 2>&1 | hexdump -C
          
          # Check what we have
          file lockipcc_arm64e.macho 2>&1 || true
          ls -la lockipcc_arm64e.macho

      - name: Use Xcode objdump
        shell: bash
        run: |
          # Try xcrun llvm-objdump on the arm64 slice (it's already a standalone MachO)
          xcrun llvm-objdump -d -m --macho lockipcc_arm64e.macho > full_disasm.txt 2>&1 || true
          wc -l full_disasm.txt
          
          # Also try otool -d 
          xcrun otool -d lockipcc_arm64e.macho > otool_disasm.txt 2>&1 || true
          wc -l otool_disasm.txt
          
          # Get ObjC class/method list
          xcrun otool -O lockipcc_arm64e.macho > objc_methods.txt 2>&1 || true
          wc -l objc_methods.txt
          head -100 objc_methods.txt

      - name: Find activation functions in disasm
        shell: bash
        run: |
          echo "=== ALL references to calculateCorrectActivateCode ==="
          grep -n "calculateCorrectActivateCode" full_disasm.txt | head -30 || true
          
          echo ""
          echo "=== ALL references to getFixedMachineCode ==="
          grep -n "getFixedMachineCode" full_disasm.txt | head -30 || true
          
          echo ""
          echo "=== ALL references to copyMachineCode ==="
          grep -n "copyMachineCode" full_disasm.txt | head -30 || true
          
          echo ""
          echo "=== ALL references to bootstrap_register ==="
          grep -n "bootstrap_register" full_disasm.txt | head -30 || true
          
          echo ""
          echo "=== ALL references to isActivated ==="
          grep -n "isActivated" full_disasm.txt | head -30 || true
          
          echo ""
          echo "=== ALL references to keychain ==="
          grep -n "keychain" full_disasm.txt | head -30 || true
          
          echo ""
          echo "=== ALL references to fileport ==="
          grep -n "fileport" full_disasm.txt | head -30 || true

      - uses: actions/upload-artifact@v4
        with:
          name: lockipcc_rev2
          path: |
            full_disasm.txt
            otool_disasm.txt
            objc_methods.txt
