name: LockIPCC Reverse Engineering

on:
  workflow_dispatch:

jobs:
  rev:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Extract arm64e slice + analyze
        shell: bash
        run: |
          BIN="LockIPCC_analysis/extracted/Payload/LockIPCC.app/LockIPCC"
          # Show FAT info
          echo "=== FAT slices ==="
          xcrun otool -f "$BIN"
          
          # arm64e slice offset 0x88000, size ~0x88910
          # Extract arm64e slice
          dd if="$BIN" of=/tmp/arm64e.bin bs=1 skip=$((0x88000)) count=$((0x88910)) 2>/dev/null
          file /tmp/arm64e.bin
          
          # Analyze arm64e slice with otool (doesn't auto-strip PAC for IMPs)
          echo ""
          echo "=== otool -o on arm64e slice ==="
          xcrun otool -o /tmp/arm64e.bin > /tmp/objc_arm64e.txt 2>&1
          head -200 /tmp/objc_arm64e.txt
          
          # Also analyze full binary but explicitly targeting arm64e
          echo ""
          echo "=== arm64 slice ObjC ==="
          xcrun otool -arch arm64 -o "$BIN" > /tmp/objc_arm64.txt 2>&1
          head -100 /tmp/objc_arm64.txt
          
          echo ""
          echo "=== arm64e slice ObjC ==="
          xcrun otool -arch arm64e -o "$BIN" > /tmp/objc_arm64e_full.txt 2>&1
          head -100 /tmp/objc_arm64e_full.txt
          
          echo ""
          echo "=== Activation methods in arm64e ==="
          grep -inE "activat|machinecode|carrier|bootstrap|lockcarrier|keychain|fileport|persist|isactiv|global.*tapped|copyMachine" /tmp/objc_arm64e_full.txt || echo "NONE FOUND"
          
          echo ""
          echo "=== All classes in arm64e ==="
          grep -E "^		Class|^Class name" /tmp/objc_arm64e_full.txt | head -30

      - name: Full disasm
        shell: bash
        run: |
          BIN="LockIPCC_analysis/extracted/Payload/LockIPCC.app/LockIPCC"
          
          # Disassemble arm64e slice specifically
          xcrun llvm-objdump --arch=arm64e -d -m "$BIN" > /tmp/full_disasm_arm64e.txt 2>&1 || true
          echo "arm64e disasm lines: $(wc -l < /tmp/full_disasm_arm64e.txt)"
          
          xcrun llvm-objdump --arch=arm64 -d -m "$BIN" > /tmp/full_disasm_arm64.txt 2>&1 || true
          echo "arm64 disasm lines: $(wc -l < /tmp/full_disasm_arm64.txt)"
          
          echo ""
          echo "=== grep activation in arm64e disasm ==="
          grep -inE "activat|machinecode|carrier|bootstrap|lockcarrier|keychain|fileport|persist|isactiv|copyMachine" /tmp/full_disasm_arm64e.txt | head -20 || echo "NONE"
          
          echo ""
          echo "=== grep activation in arm64 disasm ==="
          grep -inE "activat|machinecode|carrier|bootstrap|lockcarrier|keychain|fileport|persist|isactiv|copyMachine" /tmp/full_disasm_arm64.txt | head -20 || echo "NONE"

      - name: otool verbose
        shell: bash
        run: |
          BIN="LockIPCC_analysis/extracted/Payload/LockIPCC.app/LockIPCC"
          xcrun otool -V -l "$BIN" > /tmp/otool_sections.txt 2>&1
          xcrun nm -m "$BIN" > /tmp/nm_all.txt 2>&1 || true
          echo "=== nm grep activation ==="
          grep -inE "activat|machine|bootstrap|fileport" /tmp/nm_all.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: lockipcc_rev
          path: |
            /tmp/objc_all.txt
            /tmp/full_disasm.txt
            /tmp/otool_sections.txt
            /tmp/nm_all.txt
