name: LockIPCC Reverse Engineering

on:
  workflow_dispatch:

jobs:
  rev:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Verify binary + ObjC metadata
        shell: bash
        run: |
          BIN="LockIPCC_analysis/extracted/Payload/LockIPCC.app/LockIPCC"
          if [ ! -f "$BIN" ]; then echo "NOT FOUND: $BIN"; ls -la LockIPCC_analysis/; exit 1; fi
          file "$BIN"
          ls -la "$BIN"
          
          # otool -o shows all ObjC classes + methods with IMP addresses
          xcrun otool -o "$BIN" > /tmp/objc_all.txt 2>&1
          echo "=== ObjC metadata ==="
          head -300 /tmp/objc_all.txt
          echo ""
          echo "=== Activation methods ==="
          grep -inE "activat|machinecode|carrier.*suffix|bootstrap|lockcarrier|keychain|fileport|persist|isactiv|global.*tapped" /tmp/objc_all.txt || echo "NONE FOUND"

      - name: Full disasm
        shell: bash
        run: |
          BIN="LockIPCC_analysis/extracted/Payload/LockIPCC.app/LockIPCC"
          xcrun llvm-objdump -d -m "$BIN" > /tmp/full_disasm.txt 2>&1 || true
          echo "Lines: $(wc -l < /tmp/full_disasm.txt)"
          
          # Grab sections around our target functions
          echo ""
          echo "=== calculateCorrectActivateCode in disasm ==="
          grep -A 80 "calculateCorrectActivateCode" /tmp/full_disasm.txt | head -100
          echo ""
          echo "=== getFixedMachineCode in disasm ==="
          grep -A 80 "getFixedMachineCode" /tmp/full_disasm.txt | head -100
          echo ""
          echo "=== getCorrectActivateCode in disasm ==="
          grep -A 60 "getCorrectActivateCode" /tmp/full_disasm.txt | head -80
          echo ""
          echo "=== copyMachineCode in disasm ==="
          grep -A 60 "copyMachineCode" /tmp/full_disasm.txt | head -80
          echo ""
          echo "=== bootstrap_register in disasm ==="
          grep -A 40 "bootstrap_register" /tmp/full_disasm.txt | head -60
          echo ""
          echo "=== fileport_makeport / fileport_makefd ==="
          grep -A 40 -B 5 "fileport" /tmp/full_disasm.txt | head -80

      - name: otool verbose
        shell: bash
        run: |
          BIN="LockIPCC_analysis/extracted/Payload/LockIPCC.app/LockIPCC"
          xcrun otool -V -l "$BIN" > /tmp/otool_sections.txt 2>&1
          xcrun nm -m "$BIN" > /tmp/nm_all.txt 2>&1 || true
          echo "=== nm grep activation ==="
          grep -inE "activat|machine|bootstrap|fileport" /tmp/nm_all.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: lockipcc_rev
          path: |
            /tmp/objc_all.txt
            /tmp/full_disasm.txt
            /tmp/otool_sections.txt
            /tmp/nm_all.txt
